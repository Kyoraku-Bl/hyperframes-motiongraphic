<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"hook","type":"string","label":"Hook line","default":"ONE STAR?! ONE HATER?! NO DINERS?!"},{"id":"endline","type":"string","label":"End card","default":"Your website. Done for you."},{"id":"handle","type":"string","label":"Instagram handle","default":"@sitely_studioo"},{"id":"accent","type":"color","label":"Dark green accent","default":"#1F4736"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>sitely_studioo — One Star?! (18s Reel)</title>
    <!-- GSAP is vendored locally so renders never depend on the network. -->
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      :root {
        --cream: #f3eee2;
        --green: #1f4736;
        --ink: #121715;
        --gold: #f0c987;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #hook,
      #pitch,
      #proof,
      #cta {
        z-index: 1;
      }
      #fx {
        z-index: 4;
        pointer-events: none;
      }
      #captions {
        z-index: 5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- SHOT 1: 0-3s, hook -->
      <div
        id="hook"
        class="scene-host"
        data-composition-id="hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- SHOT 2: 3-8s, the pitch -->
      <div
        id="pitch"
        class="scene-host"
        data-composition-id="pitch"
        data-composition-src="compositions/02-pitch.html"
        data-start="3"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- SHOT 3: 8-13s, the proof -->
      <div
        id="proof"
        class="scene-host"
        data-composition-id="proof"
        data-composition-src="compositions/03-proof.html"
        data-start="8"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- SHOT 4: 13-18s, CTA, end card and the loop-back frame -->
      <div
        id="cta"
        class="scene-host"
        data-composition-id="cta"
        data-composition-src="compositions/04-cta.html"
        data-start="13"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Anime film treatment: grain, bloom, dust, smears, impact, speed lines -->
      <div
        id="fx"
        class="scene-host"
        data-composition-id="fx"
        data-composition-src="compositions/05-fx.html"
        data-start="0"
        data-duration="18"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Every subtitle group lives on this one captions track -->
      <div
        id="captions"
        class="scene-host"
        data-composition-id="captions"
        data-composition-src="compositions/06-captions.html"
        data-start="0"
        data-duration="18"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Room tone (no music — the creator adds trending audio in Instagram) -->
      <audio
        id="a-room"
        class="clip"
        src="assets/audio/cafe-ambience.wav"
        data-start="0"
        data-duration="18"
        data-volume="0.22"
        data-fade-in="0.15"
        data-fade-out="0.25"
        data-track-index="11"
      ></audio>

      <!-- Exact effects, one per visible action -->
      <audio id="a-steps" class="clip" src="assets/audio/sfx-footsteps.wav" data-start="0" data-duration="0.9" data-volume="0.45" data-track-index="12"></audio>
      <audio id="a-laptop" class="clip" src="assets/audio/sfx-laptop.wav" data-start="3.15" data-duration="0.24" data-volume="0.55" data-track-index="13"></audio>
      <audio id="a-whip" class="clip" src="assets/audio/sfx-whip.wav" data-start="7.9" data-duration="0.3" data-volume="0.34" data-track-index="14"></audio>
      <audio id="a-slam" class="clip" src="assets/audio/sfx-whip.wav" data-start="0.02" data-duration="0.3" data-volume="0.5" data-track-index="9"></audio>
      <audio id="a-ctahit" class="clip" src="assets/audio/sfx-whip.wav" data-start="13.0" data-duration="0.3" data-volume="0.42" data-track-index="10"></audio>
      <audio id="a-ping" class="clip" src="assets/audio/sfx-ping.wav" data-start="9.35" data-duration="0.62" data-volume="0.5" data-track-index="15"></audio>
      <audio id="a-cup" class="clip" src="assets/audio/sfx-cup.wav" data-start="10.42" data-duration="0.34" data-volume="0.45" data-track-index="16"></audio>
      <audio id="a-cloth" class="clip" src="assets/audio/sfx-cloth.wav" data-start="11.85" data-duration="0.44" data-volume="0.3" data-track-index="17"></audio>

      <!-- DIALOGUE: five natural lines, four recorded in the salesman voice -->
      <audio id="a-open" class="clip" src="assets/audio/vo-r29-open.mp3" data-start="0.15" data-duration="2.853" data-playback-rate="1.0" data-volume="1.0" data-track-index="18"></audio>
      <audio id="a-angle" class="clip" src="assets/audio/vo-r29-angle.mp3" data-start="3.05" data-duration="5.008" data-playback-rate="1.0" data-volume="1.0" data-track-index="19"></audio>
      <audio id="a-vo" class="clip" src="assets/audio/vo-r0-vo.mp3" data-start="8.1" data-duration="3.392" data-playback-rate="1.0" data-volume="1.0" data-track-index="20"></audio>
      <audio id="a-thanks" class="clip" src="assets/audio/vo-thanks.mp3" data-start="11.57" data-duration="1.45" data-playback-rate="1.369" data-volume="0.9" data-track-index="21"></audio>
      <audio id="a-cta" class="clip" src="assets/audio/vo-r0-cta.mp3" data-start="13.05" data-duration="3.376" data-playback-rate="1.0" data-volume="1.0" data-track-index="22"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
